name: RepFlow
options:
  minimumXcodeGenVersion: 2.44.1
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, Base]
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    CLANG_ENABLE_MODULES: YES
packages:
  RepFlowCore:
    path: .
targets:
  RepFlow:
    type: application
    platform: iOS
    sources:
      - path: PhoneApp
      - path: Shared
      - path: Resources/Phone/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
    info:
      path: Resources/Phone/Info.plist
      properties:
        CFBundleDisplayName: 组迹
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.RepFlow
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: RepFlowCore
      - target: RepFlowWatch
        embed: true
    scheme:
      gatherCoverageData: false
  RepFlowWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
      - path: Shared
      - path: Resources/Watch/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
    info:
      path: Resources/Watch/Info.plist
      properties:
        CFBundleDisplayName: 组迹
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.RepFlow
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: 训练时读取心率和活动能量，在本次训练中显示运动强度。你也可以不授权并使用手动记录。
        NSHealthUpdateUsageDescription: 将你确认结束的力量训练保存到 Apple 健康，包括训练时长与活动能量。
        NSMotionUsageDescription: 训练组进行时使用手腕运动传感器估算动作次数，你可以随时修正或切换为手动计次。
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Resources/Watch/RepFlowWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.RepFlow.watchkitapp
        TARGETED_DEVICE_FAMILY: '4'
        SDKROOT: watchos
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: RepFlowCore
    scheme:
      gatherCoverageData: false
